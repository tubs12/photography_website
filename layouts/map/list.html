{{ define "main" }}

    <h1 id="map-heading"></h1>
    <p class="map-percent" id="map-percent"></p>
  </div>
  <div class="map-wrap">
    <div class="map-container" id="map"></div>
    <div class="map-tooltip" id="map-tooltip"></div>
  </div>
</section>

const visitedIds = new Set(
  visitedAlpha2.map(c => alpha2ToNumeric[c]).filter(Boolean).map(id => id.padStart(3, "0"))
);

const total = 195;
const count = visitedIds.size;
const pct = ((count / total) * 100).toFixed(1);
document.getElementById("map-heading").textContent = `${count} / ${total} countries`;
document.getElementById("map-percent").textContent = `${pct}% of the world seen`;

const W = 960, H = 500;
const svg = d3.select("#map")
  .append("svg")
  .attr("viewBox", `0 0 ${W} ${H}`)
  .attr("preserveAspectRatio", "xMidYMid meet");

const projection = d3.geoNaturalEarth1()
  .scale(153)
  .translate([W / 2, H / 2]);

const path = d3.geoPath().projection(projection);
const tooltip = document.getElementById("map-tooltip");
const mapEl = document.getElementById("map");

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
  svg.selectAll("path")
    .data(topojson.feature(world, world.objects.countries).features)
    .join("path")
    .attr("d", path)
    .attr("fill", d => visitedIds.has(d.id) ? "var(--map-visited)" : "var(--map-unvisited)")
    .attr("stroke", "#fff")
    .attr("stroke-width", 0.5)
    .on("mousemove", function(event, d) {
      const name = countryNames[String(+d.id)];
      if (!name) return;
      const rect = mapEl.getBoundingClientRect();
      tooltip.textContent = name;
      tooltip.style.display = "block";
      tooltip.style.left = (event.clientX - rect.left + 12) + "px";
      tooltip.style.top = (event.clientY - rect.top - 32) + "px";
    })
    .on("mouseleave", () => {
      tooltip.style.display = "none";
    });
});

{{ end }}
